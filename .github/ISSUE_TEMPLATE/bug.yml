name: Bug
description: Something in the hotel doesn't work as designed
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: And what you expected instead }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: How to reproduce }
    validations: { required: true }
  - type: input
    id: where
    attributes: { label: Component and version, placeholder: "plugin 0.0.0 (commit abc123), macOS 15, Live 12" }
